name: Release Linux (Flatpak & Tarball)

'on':
  push:
    tags:
      - 'v*-linux-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v0.1.0-linux-test.1'
        required: true
        type: string
      prerelease:
        description: 'Publish as a prerelease'
        required: true
        default: false
        type: boolean
      mode:
        description: 'full builds the release packages; compile-check only verifies that the Linux target compiles'
        required: true
        default: full
        type: choice
        options:
          - full
          - compile-check
      package_formats:
        description: 'Package formats to build and export'
        required: true
        default: both
        type: choice
        options:
          - both
          - flatpak
          - tarball
      smoke_test:
        description: 'Run the headless (Xvfb) smoke test after the build'
        required: true
        default: true
        type: boolean
      publish:
        description: 'Create or update the GitHub Release with the built assets'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  FLATPAK_RUNTIME_VERSION: '25.08'

jobs:
  build-and-release:
    name: Build Linux packages (Flatpak & Tarball) and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Reclaim runner disk space
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          avail="$(df --output=avail -BG / | tail -n 1 | tr -dc '0-9')"
          if [[ "${avail:-0}" -gt 40 ]]; then
            echo "root has ${avail}G free; skipping cleanup"
            df -h /
            exit 0
          fi
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules
          sudo apt-get clean
          df -h /

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PACKAGE_FORMATS: ${{ inputs.package_formats }}
          INPUT_SMOKE_TEST: ${{ inputs.smoke_test }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          publish=true
          mode="${INPUT_MODE:-full}"
          package_formats="${INPUT_PACKAGE_FORMATS:-both}"
          smoke_test="${INPUT_SMOKE_TEST:-true}"
          if [[ "$EVENT_NAME" == 'push' && "$GITHUB_REF" == refs/tags/* ]]; then
            release_tag="$REF_NAME"
            [[ "$release_tag" == *-* ]] && is_prerelease=true || is_prerelease=false
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            release_tag="${INPUT_RELEASE_TAG//[[:space:]]/}"
            is_prerelease="$INPUT_PRERELEASE"
            publish="${INPUT_PUBLISH:-true}"
          else
            release_tag="v0.0.0-ci.${GITHUB_RUN_NUMBER}"
            is_prerelease=true
            publish=false
          fi
          if [[ ! "$release_tag" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          version_name="$(printf '%s' "$release_tag" | sed -nE 's/^v?([0-9]+(\.[0-9]+)*).*/\1/p')"
          if [[ -z "$version_name" ]]; then
            echo "Cannot derive a numeric version from tag: $release_tag" >&2
            exit 1
          fi
          {
            echo "tag=$release_tag"
            echo "version-name=$version_name"
            echo "build-number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
            echo "mode=$mode"
            echo "package-formats=$package_formats"
            echo "smoke-test=$smoke_test"
            echo "prerelease=$is_prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

      - name: Install system dependencies and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache \
            lbzip2 p7zip-full flatpak flatpak-builder \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libasound2-dev libpulse-dev libdbus-1-dev \
            libudev-dev libunwind-dev libfontconfig1-dev

      - name: Set up Flathub Freedesktop Runtime
        if: steps.release.outputs.mode == 'full' && (steps.release.outputs.package-formats == 'both' || steps.release.outputs.package-formats == 'flatpak')
        shell: bash
        env:
          RUNTIME_VER: ${{ env.FLATPAK_RUNTIME_VERSION }}
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub "org.freedesktop.Platform//$RUNTIME_VER" "org.freedesktop.Sdk//$RUNTIME_VER"

      - name: Download the game data from the source release
        if: steps.release.outputs.mode == 'full'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_REPOSITORY: ${{ vars.DATA_REPOSITORY }}
        run: |
          set -euo pipefail
          rm -rf data
          python3 tools/fetch_data_parts.py --dest data

      - name: Inject the game version into status.tjs
        if: steps.release.outputs.mode == 'full'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 tools/inject_game_version.py \
            --tag "$RELEASE_TAG" \
            --status data/system/Status.tjs

      - name: Generate complete content manifest
        if: steps.release.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_content_manifest.py \
            --root data \
            --output data/content-manifest.json \
            --config content-packs.json \
            --cache "$RUNNER_TEMP/content-manifest-cache.json" \
            --full

      - name: Configure and build Linux target (compile-check)
        if: steps.release.outputs.mode == 'compile-check'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/linux-check -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOPTION_BUILD_MACOS_BUNDLE=OFF \
            -DKRKRSDL2_GENERATE_CONTENT_MANIFEST=OFF \
            -DKRKRSDL2_INSTALL_LINUX_DATA=OFF
          cmake --build build/linux-check --target krkrsdl2 --parallel "$(nproc)"
          file build/linux-check/krkrsdl2
          ldd build/linux-check/krkrsdl2 | sort

      - name: Restore cached ccache
        id: ccache
        if: steps.release.outputs.mode == 'full'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-release-ccache-v1-${{ github.sha }}
          restore-keys: |
            linux-release-ccache-v1-

      - name: Build native Linux target (full)
        if: steps.release.outputs.mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          export CCACHE_DIR="$HOME/.cache/ccache"
          ccache -z || true
          cmake -S . -B build/linux-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPTION_BUILD_MACOS_BUNDLE=OFF \
            -DKRKRSDL2_GENERATE_CONTENT_MANIFEST=OFF \
            -DKRKRSDL2_INSTALL_LINUX_DATA=OFF
          cmake --build build/linux-release --target krkrsdl2 --parallel "$(nproc)"
          ccache -s || true
          file build/linux-release/krkrsdl2

      - name: Save cached ccache
        if: steps.release.outputs.mode == 'full' && steps.ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: linux-release-ccache-v1-${{ github.sha }}

      - name: Headless smoke test
        if: steps.release.outputs.mode == 'full' && steps.release.outputs.smoke-test == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils imagemagick python3-pil mesa-utils libgl1-mesa-dri
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          sleep 3
          shot="$RUNNER_TEMP/game-smoke-shot.png"
          log="$RUNNER_TEMP/game-smoke-run.log"
          diag="$RUNNER_TEMP/game-smoke-diag.txt"
          rm -f "$shot" "$diag"

          (
            sleep 15
            {
              echo "=== xwininfo -root -tree ==="
              xwininfo -root -tree 2>&1 || true
              echo "=== xlsclients ==="
              xlsclients -l 2>&1 | head -n 40 || true
            } > "$diag" 2>&1
            import -window root "$shot" 2>/dev/null || true
          ) &

          set +e
          timeout --signal=TERM --kill-after=20 45 ./build/linux-release/krkrsdl2 > "$log" 2>&1
          status=$?
          set -e
          echo "--- Smoke test exit status: $status ---"
          grep -v 'LYRIMGCHG' "$log" | tail -n 80 || true
          cat "$diag" 2>/dev/null || true
          ls -l "$shot" 2>/dev/null || echo "no screenshot was captured"

      - name: Upload smoke test diagnostics
        if: always() && steps.release.outputs.mode == 'full' && steps.release.outputs.smoke-test == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-diagnostics
          path: |
            ${{ runner.temp }}/game-smoke-shot.png
            ${{ runner.temp }}/game-smoke-diag.txt
            ${{ runner.temp }}/game-smoke-run.log
          if-no-files-found: warn
          retention-days: 5

      - name: Verify smoke test results
        if: steps.release.outputs.mode == 'full' && steps.release.outputs.smoke-test == 'true'
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/game-smoke-run.log"
          shot="$RUNNER_TEMP/game-smoke-shot.png"
          fail=0
          if ! grep -q 'VIDSOFTBLIT .*result=0' "$log"; then
            echo "::error::Engine failed to present a frame"
            grep -E 'VIDREACH|VIDSOFTBLIT|VIDTICK' "$log" | head -n 10 || true
            fail=1
          fi
          frames="$(grep -c 'LYRIMGCHG' "$log" 2>/dev/null || echo 0)"
          if [[ "${frames:-0}" -lt 3 ]]; then
            echo "::error::Engine reported fewer than 3 layer updates (${frames:-0})"
            fail=1
          fi
          echo "Engine layer updates: ${frames:-0}"
          if [[ -f "$shot" ]]; then
            python3 tools/check_smoke_screenshot.py "$shot" 2>&1 || true
          fi
          exit "$fail"

      - name: Package standard .tar.bz2 distribution
        if: steps.release.outputs.mode == 'full' && (steps.release.outputs.package-formats == 'both' || steps.release.outputs.package-formats == 'tarball')
        id: pkg-tarball
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          arch="$(uname -m)"
          dir_name="Yosuga-no-Sora-HD-Remake-Linux-$arch-$RELEASE_TAG"
          stage_dir="$RUNNER_TEMP/stage-tarball/$dir_name"
          mkdir -p "$stage_dir"

          cp build/linux-release/krkrsdl2 "$stage_dir/"
          cp -r data "$stage_dir/"

          icon="src/resources/linux/icons/hicolor/256x256/apps/yosuganosora.png"
          if [[ -f "$icon" ]]; then
            cp "$icon" "$stage_dir/yosuganosora.png"
          fi

          cat << 'EOF' > "$stage_dir/start.sh"
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")" && pwd)"
          cd "$SCRIPT_DIR"
          exec ./krkrsdl2 "$@"
          EOF
          chmod +x "$stage_dir/start.sh"

          cat << 'EOF' > "$stage_dir/yosuganosora.desktop"
          [Desktop Entry]
          Type=Application
          Name=Yosuga no Sora: HD Remake
          Comment=Yosuga no Sora: HD Remake
          Exec=./start.sh
          Icon=yosuganosora
          Terminal=false
          Categories=Game;AdventureGame;
          EOF

          echo "Compressing into $dir_name.tar.bz2 via lbzip2..."
          tar -C "$RUNNER_TEMP/stage-tarball" --use-compress-program="lbzip2" -cf "$asset_dir/$dir_name.tar.bz2" "$dir_name"
          rm -rf "$RUNNER_TEMP/stage-tarball"
          ls -lh "$asset_dir/$dir_name.tar.bz2"

      - name: Package Flatpak application bundle (.flatpak)
        if: steps.release.outputs.mode == 'full' && (steps.release.outputs.package-formats == 'both' || steps.release.outputs.package-formats == 'flatpak')
        id: pkg-flatpak
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RUNTIME_VER: ${{ env.FLATPAK_RUNTIME_VERSION }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          arch="$(uname -m)"
          app_id="com.nichinichisou0607.yosuganosora.hdremake"
          flatpak_work="$RUNNER_TEMP/flatpak-work"
          mkdir -p "$flatpak_work/staged"

          cp build/linux-release/krkrsdl2 "$flatpak_work/staged/"
          cp -r data "$flatpak_work/staged/"

          cat << 'EOF' > "$flatpak_work/staged/yosuganosora"
          #!/bin/sh
          USER_GAME_DIR="${XDG_DATA_HOME:-$HOME/.var/app/com.nichinichisou0607.yosuganosora.hdremake/data}/yosuganosora"
          mkdir -p "$USER_GAME_DIR"
          if [ ! -e "$USER_GAME_DIR/data" ]; then
            ln -s /app/share/yosuganosora/data "$USER_GAME_DIR/data"
          fi
          cd "$USER_GAME_DIR"
          exec /app/bin/krkrsdl2 "$@"
          EOF
          chmod +x "$flatpak_work/staged/yosuganosora"

          icon="src/resources/linux/icons/hicolor/256x256/apps/yosuganosora.png"
          if [[ -f "$icon" ]]; then
            cp "$icon" "$flatpak_work/staged/$app_id.png"
          fi

          cat << EOF > "$flatpak_work/staged/$app_id.desktop"
          [Desktop Entry]
          Type=Application
          Name=Yosuga no Sora: HD Remake
          Comment=Yosuga no Sora: HD Remake
          Exec=yosuganosora
          Icon=$app_id
          Terminal=false
          Categories=Game;AdventureGame;
          EOF

          cat << EOF > "$flatpak_work/staged/$app_id.metainfo.xml"
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>$app_id</id>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>Proprietary</project_license>
            <name>Yosuga no Sora: HD Remake</name>
            <summary>Yosuga no Sora HD Remake for Linux</summary>
          </component>
          EOF

          cat << EOF > "$flatpak_work/$app_id.yaml"
          app-id: $app_id
          runtime: org.freedesktop.Platform
          runtime-version: '$RUNTIME_VER'
          sdk: org.freedesktop.Sdk
          command: yosuganosora
          finish-args:
            - --share=ipc
            - --socket=fallback-x11
            - --socket=wayland
            - --socket=pulseaudio
            - --device=dri
          modules:
            - name: yosuganosora
              buildsystem: simple
              build-commands:
                - install -Dm755 krkrsdl2 /app/bin/krkrsdl2
                - install -Dm755 yosuganosora /app/bin/yosuganosora
                - mkdir -p /app/share/yosuganosora
                - cp -r data /app/share/yosuganosora/
                - install -Dm644 $app_id.desktop /app/share/applications/$app_id.desktop
                - install -Dm644 $app_id.png /app/share/icons/hicolor/256x256/apps/$app_id.png
                - install -Dm644 $app_id.metainfo.xml /app/share/metainfo/$app_id.metainfo.xml
              sources:
                - type: dir
                  path: $flatpak_work/staged
          EOF

          flatpak-builder --user --force-clean \
            --repo="$flatpak_work/repo" \
            "$flatpak_work/build-dir" \
            "$flatpak_work/$app_id.yaml"

          bundle_name="Yosuga-no-Sora-HD-Remake-Linux-$arch-$RELEASE_TAG.flatpak"
          flatpak build-bundle --arch="$arch" \
            "$flatpak_work/repo" \
            "$asset_dir/$bundle_name" \
            "$app_id"

          rm -rf "$flatpak_work"
          ls -lh "$asset_dir/$bundle_name"

      - name: Verify asset sizes and split files exceeding 2 GB
        if: steps.release.outputs.mode == 'full'
        id: package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RUNTIME_VER: ${{ env.FLATPAK_RUNTIME_VERSION }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          cd "$asset_dir"
          shopt -s nullglob
          payloads=( *.tar.bz2 *.flatpak )
          if [[ "${#payloads[@]}" -eq 0 ]]; then
            echo "Error: No release assets produced." >&2
            exit 1
          fi

          for payload in "${payloads[@]}"; do
            size_mb=$(($(stat -c '%s' "$payload") / 1024 / 1024))
            echo "Inspecting $payload (${size_mb} MB)..."
            # GitHub Releases API strictly enforces a 2 GiB per-file upload limit.
            if [[ "$size_mb" -gt 1950 ]]; then
              echo "File exceeds 1950 MB limit. Chunking $payload into multi-part 7z volumes..."
              7z a -t7z -mx=0 -mmt=on -v1900m "${payload}.7z" "$payload"
              7z t "${payload}.7z.001"
              rm -f "$payload"
            fi
          done

          shopt -s nullglob
          all_assets=( * )
          {
            echo 'Yosuga no Sora: HD Remake'
            echo 'Platform: Linux (x86_64)'
            echo "Release: $RELEASE_TAG"
            echo "Commit: $GITHUB_SHA"
            echo "Flatpak Runtime: org.freedesktop.Platform//$RUNTIME_VER"
            echo
            echo 'Installation Instructions:'
            echo '=========================='
            echo '1. Flatpak package (.flatpak):'
            echo '   - If single file: flatpak install ./Yosuga-no-Sora-*.flatpak'
            echo '   - If split (.7z.NNN): extract with 7-Zip or p7zip first, then run flatpak install'
            echo '   - Run with: flatpak run com.nichinichisou0607.yosuganosora.hdremake'
            echo
            echo '2. Standard Tarball (.tar.bz2):'
            echo '   - If single file: tar -xjf ./Yosuga-no-Sora-*.tar.bz2'
            echo '   - If split (.7z.NNN): extract with 7-Zip, then unpack the .tar.bz2'
            echo '   - Run with: ./start.sh'
            echo
            echo 'SHA-256 Checksums:'
            echo '=================='
            for f in "${all_assets[@]}"; do
              if [[ -f "$f" ]]; then
                echo "$(sha256sum "$f" | cut -d' ' -f1)  $f"
              fi
            done
          } > BUILD-INFO.txt

          if [[ -f "$GITHUB_WORKSPACE/tools/generate_notices.py" ]]; then
            python3 "$GITHUB_WORKSPACE/tools/generate_notices.py" --output THIRD-PARTY-NOTICES.txt || true
          fi

          rm -rf "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/data"
          ls -lh
          echo "asset-directory=$asset_dir" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        if: steps.release.outputs.mode == 'full' && steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
          ASSET_DIRECTORY: ${{ steps.package.outputs.asset-directory }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("$ASSET_DIRECTORY"/*)
          [[ "${#assets[@]}" -gt 0 ]]
          exists=false
          is_draft=false

          if json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" \
            --json isDraft 2>/dev/null); then
            exists=true
            is_draft=$(python3 -c \
              'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
              <<<"$json")
          else
            args=(release create "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft \
              --title "$RELEASE_TAG" --generate-notes)
            [[ "$EVENT_NAME" == 'push' ]] && args+=(--verify-tag) || args+=(--target "$COMMIT_SHA")
            [[ "$IS_PRERELEASE" == 'true' ]] && args+=(--prerelease)
            if ! gh "${args[@]}"; then
              for ((attempt = 1; attempt <= 12; attempt++)); do
                if json=$(gh release view "$RELEASE_TAG" --repo "$GH_REPOSITORY" \
                  --json isDraft 2>/dev/null); then
                  exists=true
                  is_draft=$(python3 -c \
                    'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())' \
                    <<<"$json")
                  break
                fi
                echo "Waiting for concurrent release creation ($attempt/12)..."
                sleep 5
              done
              [[ "$exists" == 'true' ]] || exit 1
            fi
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GH_REPOSITORY" --clobber

          if [[ "$exists" == 'false' || "$is_draft" == 'true' ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GH_REPOSITORY" --draft=false
          fi
